<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Lernstand</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <h1>Lernstand-API</h1>
<h2>Neues Thema anlegen</h2>
<form id="neu-form">
  <input id="titel-input" placeholder="Titel (Pflicht)" required>
  <select id="kategorie-select" required>
    <option value="">Kategorie wählen…</option>
  </select>
  <input id="notiz-input" placeholder="Notiz (freiwillig)">
  <button type="submit">Anlegen</button>
</form>
  <button id="lade-btn">Themen laden</button>
  <ul id="themen-liste"></ul>
</body>
</html>
