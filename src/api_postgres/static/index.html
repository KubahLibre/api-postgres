<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lernstand</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
   <header>
    <h1>Lernstand-API</h1>
    <div class="kopf-zeile">
      <p class="unterzeile">Browser &rarr; FastAPI &rarr; PostgreSQL</p>

      <details class="kategorien-pop">
        <summary>Kategorien</summary>
        <div class="pop-fenster">
          <form id="kategorie-form">
            <label>Name (Pflicht)
              <input id="kategorie-name" required>
            </label>
            <button type="submit" class="anlege-btn">Anlegen</button>
          </form>
          <ul id="kategorien-liste"></ul>
        </div>
      </details>
    </div>
  </header>

  <section class="form-karte">
    <h2>Neues Thema anlegen</h2>
    <form id="neu-form">
      <label>Titel (Pflicht)
        <input id="titel-input" required>
      </label>
      <label>Kategorie
        <select id="kategorie-select" required>
          <option value="">Kategorie w&auml;hlen&hellip;</option>
        </select>
      </label>
      <label>Notiz (freiwillig)
        <input id="notiz-input">
      </label>
      <button type="submit" class="anlege-btn">Anlegen</button>
    </form>
  </section>
  <label class="filter-zeile">Nur zeigen
    <select id="filter-auswahl">
      <option value="">alle</option>
      <option value="offen">offen</option>
      <option value="angefangen">angefangen</option>
      <option value="erledigt">erledigt</option>
    </select>
  </label>
  <ul id="themen-liste"></ul>
</body>
</html>
